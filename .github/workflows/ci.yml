name: CI

on:
  push:
    branches: [main, v3]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build de packages/shared (lo consumen api y web)
        run: pnpm --filter @digiclin/shared build

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm test

      - name: Contrato OpenAPI al dia
        run: |
          pnpm openapi
          git diff --exit-code -- apps/api/openapi.json apps/web/src/lib/api-schema.d.ts \
            || (echo "::error::El contrato OpenAPI cambio. Ejecuta 'pnpm openapi' y versiona el resultado." && exit 1)

      - run: pnpm build
